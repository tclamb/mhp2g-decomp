name: eboot
sha1: de96bd007ef69b59af9188bee5e7de53987ea2b6
options:
  basename: eboot.elf
  target_path: modules/eboot.elf
  base_path: ..
  platform: psp
  compiler: MWCCPS2

  asm_path: asm/eboot
  src_path: src/eboot
  asset_path: assets/eboot
  build_path: build
  extensions_path: tools/splat_ext

  ld_script_path: build/config/eboot.elf.ld
  ld_generate_symbol_per_data_segment: True

  gp_value: 0x089ceb50

  symbol_name_format: eboot_$VRAM
  symbol_name_format_no_rom: $VRAM

  create_asm_dependencies: True
  create_undefined_funcs_auto: True
  create_undefined_syms_auto: True
  undefined_funcs_auto_path: build/config/eboot.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/config/eboot.undefined_syms_auto.txt

  find_file_boundaries: True

  o_as_suffix: True

  symbol_addrs_path:
    - config/eboot.symbol_addrs.txt
  reloc_addrs_path:
    - config/eboot.reloc_addrs.txt

  extensions_path: tools/splat_ext

  string_encoding: SHIFT_JIS
  data_string_encoding: SHIFT_JIS
  rodata_string_guesser_level: 0
  data_string_guesser_level: 0
  add_set_gp_64: false
  pair_rodata_to_text: True
  suggestion_rodata_section_start: True

  global_vram_start: 0x08000000
  global_vram_end:   0x09ffffff

  named_regs_for_c_funcs: False
  migrate_rodata_to_functions: False
  ld_bss_is_noload: True
  disassemble_all: True
  auto_decompile_empty_functions: true
  make_full_disasm_for_code: True

  asm_inc_header: |
    .set noat      /* allow manual use of $at */
    .set noreorder /* don't insert nops after branches */

  section_order:
    - .text
    - .sceStub.text
    - .lib.ent.top
    - .lib.ent
    - .lib.ent.btm
    - .lib.stub.top
    - .lib.stub
    - .lib.stub.btm
    - .rodata.sceModuleInfo
    - .rodata.sceResident
    - .rodata.sceNid
    - .rodata
    - .data
    - .init
    - .ctor
    - .vtables
    - .bss


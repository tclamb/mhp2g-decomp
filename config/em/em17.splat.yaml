  rodata_string_guesser_level: 0
  section_order:
  - .text
  - .data
  - .rodata
  - .init
  - .ctor
  - .bss
  src_path: src/em/em17
  string_encoding: SHIFT_JIS
  suggestion_rodata_section_start: true
  symbol_addrs_path:
  - config/em/em17.symbol_addrs.txt
  symbol_name_format: em17_$VRAM
  symbol_name_format_no_rom: $VRAM
  target_path: modules/em/em17.ovl
  undefined_funcs_auto_path: build/config/em/em17.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/config/em/em17.undefined_syms_auto.txt
segments:
- - 0
  - bin
  - omit_ovl_header
- align: 4
  bss_size: 0x80
  name: em17
  start: 0x40
  subalign: 4
  subsegments:
  - [0x40, pad]
  - [0x80, asm, em17]
  - [0x120a4, pad]
  - [0x12100, data, em17]
  - [0x18400, bss, em17]
  type: code
  vram: 0x09d15140
- - 0x18400

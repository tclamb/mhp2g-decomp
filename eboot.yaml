options:
  basename: eboot.bin
  target_path: eboot.bin
  base_path: .
  platform: psp
  compiler: MWCCPS2

  asm_path: asm
  src_path: src
  build_path: build
  extensions_path: tools/splat_ext

  ld_script_path: build/eboot.bin.ld
  ld_generate_symbol_per_data_segment: True

  create_asm_dependencies: True
  create_undefined_funcs_auto: False
  create_undefined_syms_auto: False
  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt

  find_file_boundaries: True

  o_as_suffix: True

  symbol_addrs_path:
    - symbol_addrs.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  extensions_path: tools/splat_ext

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  add_set_gp_64: false
  pair_rodata_to_text: True
  suggestion_rodata_section_start: True
  
  global_vram_start: 0x08000000
  global_vram_end:   0x09ffffff
  
  named_regs_for_c_funcs: False
  migrate_rodata_to_functions: True
  ld_bss_is_noload: True
  disassemble_all: True
  
  section_order:
    - .text
    - .rodata
    - .data
    - .bss
